

spring:
  config:
    import: "aws-secretsmanager:dev/db/cred"

  datasource:
    url: ${mysql.url}
    username: ${mysql.username}
    password: ${mysql.password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  cloud:
    aws:
      region:
        static: us-east-1
      secretsmanager:
        enabled: true
        secret-name: dev/db/cred


